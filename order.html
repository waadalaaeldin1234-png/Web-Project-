    <p>نوع البضاعة: <br><input type="text" name="goods_type" required></p>

        <option value="export">تصدير</option>
      </select>
    </p>
    <p>الكمية بالطن: <br><input type="number" name="quantity" required></p>
    <p>تفاصيل: <br><textarea name="details" rows="4" cols="30"></textarea></p>
